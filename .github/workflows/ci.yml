name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Finance engine and dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Finance engine — typecheck, build, tests
        run: |
          pnpm --filter @planb/finance typecheck
          pnpm --filter @planb/finance build
          pnpm --filter @planb/finance test
      - name: Dashboard — typecheck and production build
        run: |
          pnpm --filter @planb/web typecheck
          pnpm --filter @planb/web build
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
          PLANB_AUTH_MODE: supabase
      - uses: actions/upload-artifact@v4
        with:
          name: finance-cli
          path: packages/finance/dist/cli.mjs
          retention-days: 1

  research:
    name: Database migrations and research pipeline
    runs-on: ubuntu-latest
    needs: node
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: planb
          POSTGRES_PASSWORD: planb
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U planb" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PLANB_TEST_DATABASE_URL: postgresql://planb:planb@127.0.0.1:5432/planb_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: finance-cli
          path: packages/finance/dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install research worker
        working-directory: research
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: research
        run: ruff check planb_research tests
      - name: Tests (applies every migration to a fresh PostgreSQL, then runs the pipeline and RLS suites)
        working-directory: research
        run: python -m pytest
      - name: Generated database docs are up to date
        run: |
          DATABASE_URL="$PLANB_TEST_DATABASE_URL" python scripts/gen_db_docs.py
          git diff --exit-code -- docs/DATA_DICTIONARY.md docs/ERD.md

  e2e:
    name: Dashboard end-to-end (production build, real browser, real worker)
    runs-on: ubuntu-latest
    needs: node
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: planb
          POSTGRES_PASSWORD: planb
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U planb" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm install --frozen-lockfile
      - name: Research worker (the test runs real refresh jobs)
        working-directory: research
        run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: Browser
        run: |
          npm install -g playwright@1
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: End-to-end workflow
        run: web/e2e/run.sh
