# PlanB — research backlog of distinct business operating models (India; Pune metro and Nanded tier-3 focus)
#
# STATUS: BACKLOG OF THINGS TO RESEARCH. Nothing in this file is a verified finding.
#   * No costs, revenues, margins, payback periods or success rates are recorded here, by design.
#   * capital_tier_hypothesis is an UNVERIFIED triage guess used only to order research; never show it to customers.
#   * key_regulations_to_research are research leads (names only), NOT assertions that a rule applies.
#   * typical_scales are qualitative variants to investigate, not recommendations.
#   * distinct_from lists sibling models that must not be merged with the entry.
#
# NIC-2008 codes:
#   Source: MoSPI "National Industrial Classification 2008" PDF (nic_2008_17apr09.pdf, mospi.gov.in), detailed structure.
#   verified: true means the code and its official title were looked up in that PDF on 2026-11-24.
#   It does NOT mean the choice of code for the model is beyond dispute: where notes say "NIC mapping is judgemental",
#   the classification needs a second look. Where no 5-digit sub-class clearly fits, a 4-digit class or 3-digit group is given.
#   Titles follow the PDF wording, including its spellings (e.g. "masseures", "equipments").
#
# revenue_archetype: transactions | capacity_utilization | area_yield | enrolment | occupancy | fleet_utilization | engagements
# capital_tier_hypothesis: "<5L" | "5-25L" | "25L-1Cr" | ">1Cr"
# pilot: true marks the 10 models chosen for the first full research pass.

# ───────────── agriculture-horticulture ─────────────
- slug: oyster-mushroom-cultivation
  name: "Oyster mushroom cultivation unit"
  industry: agriculture-horticulture
  family: mushroom
  operating_model: "Grows oyster (dhingri) mushrooms on pasteurised straw bags in low-cost sheds or converted rooms using purchased spawn; sells fresh or sun-dried mushrooms to local retailers, restaurants and households."
  target_customers: "Local vegetable vendors, restaurants, households via direct delivery, dried-mushroom buyers"
  distinct_from: ["button-mushroom-cultivation", "microgreens-urban-farm"]
  revenue_archetype: area_yield
  typical_scales: ["single-room hobby-commercial unit", "multi-room shed with staggered batches", "unit with drying and powder value-addition"]
  ownership_structures: ["sole proprietorship", "SHG / cooperative", "FPO / producer company"]
  geography_fit: ["metro", "tier-2", "tier-3", "rural"]
  capital_tier_hypothesis: "<5L"
  nic_2008:
    code: "01136"
    title: "Growing of mushrooms and truffles"
    verified: true
  key_regulations_to_research: ["FSSAI registration/licence", "Udyam (MSME) registration", "MIDH / state horticulture subsidy norms"]
  candidate_evidence_sources: ["icar-dmr-solan-technical-bulletins", "kvk-training-material", "nabard-model-bankable-projects", "spawn-supplier-quotes", "grower-interviews"]
  pilot: true
  research_priority: 1
  notes: "Low-capital, part-time-compatible entry model; market linkage and short shelf life are the known caveats to research."

